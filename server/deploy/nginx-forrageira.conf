# Config nginx para o Forrageira no servidor UFSJ (capim.ufsj.edu.br).
# Serve, no MESMO dominio:
#   - https://capim.ufsj.edu.br/         -> app Flutter Web (SPA)
#   - https://capim.ufsj.edu.br/api/...  -> API PHP (server/public/index.php)
#   - https://capim.ufsj.edu.br/uploads/ -> imagens enviadas
#
# Caminhos esperados no servidor:
#   - Flutter Web:  /var/www/forrageira/web        (conteudo da pasta public/ do repo)
#   - Backend PHP:  /var/www/forrageira/server/public/index.php
#   - Uploads:      /var/www/forrageira/server/public/uploads/
#
# Instalar:
#   sudo cp server/deploy/nginx-forrageira.conf /etc/nginx/sites-available/forrageira
#   sudo ln -sf /etc/nginx/sites-available/forrageira /etc/nginx/sites-enabled/forrageira
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name capim.ufsj.edu.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name capim.ufsj.edu.br;

    ssl_certificate     /etc/letsencrypt/live/capim.ufsj.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capim.ufsj.edu.br/privkey.pem;

    # Raiz = app Flutter Web.
    root /var/www/forrageira/web;
    index index.html;

    client_max_body_size 6M;

    # ---- API PHP (front controller) ----
    location /api/ {
        try_files $uri @php_api;
    }
    location @php_api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/forrageira/server/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Garante que o header Authorization (Bearer <token>) chegue ao PHP.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # ---- Imagens enviadas (servidas estaticamente) ----
    location /uploads/ {
        alias /var/www/forrageira/server/public/uploads/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # ---- Flutter Web: assets reais sao servidos direto; resto cai no index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
