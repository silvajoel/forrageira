# Config nginx para a API Forrageira (servidor UFSJ - capim.ufsj.edu.br).
# Ajuste:
#   - root: caminho real onde voce colocou o backend (.../server/public)
#   - fastcgi_pass: versao do php-fpm instalada (veja: ls /run/php/)
#
# Instalar:
#   sudo cp nginx-forrageira.conf /etc/nginx/sites-available/forrageira
#   sudo ln -s /etc/nginx/sites-available/forrageira /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # remove a pagina "Welcome to nginx"
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name capim.ufsj.edu.br;

    # >>> Ajuste este caminho <<<
    root /var/www/forrageira/server/public;
    index index.php;

    # Limite de upload (imagens ate 5 MB + folga).
    client_max_body_size 6M;

    # Imagens enviadas: servidas estaticamente direto do disco.
    location /uploads/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Tudo o mais cai no front controller (rotas /api/...).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via php-fpm.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Versao do php-fpm no servidor UFSJ: 8.2
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # Garante que o header Authorization (Bearer <token>) chegue ao PHP.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Bloqueia acesso a arquivos sensiveis e ocultos.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(config\.local\.php|config\.php|config\.sample\.php)$ { deny all; }
}

# ============================================================================
# Apos obter o certificado TLS (ex.: certbot --nginx), o proprio certbot cria
# o bloco "listen 443 ssl" e adiciona o redirecionamento de 80 -> 443.
# Veja DEPLOY.md.
# ============================================================================
